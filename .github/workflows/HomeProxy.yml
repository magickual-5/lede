name: Build HomeProxy (aarch64_cortex-a53)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true

      - name: Initialize environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo -E apt-get update
          sudo -E apt-get install -y ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential \
          bzip2 ccache cmake cpio curl device-tree-compiler flex gawk gettext git gperf haveged help2man \
          intltool libc6-dev-i386 libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev \
          libncurses5-dev libncursesw5-dev libreadline-dev libssl-dev libtool lrzsz mkisofs msmtp nano \
          ninja-build p7zip p7zip-full patch pkgconf python3 python3-pip python3-ply python3-docutils \
          qemu-utils rsync scons squashfs-tools subversion swig texinfo uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: openwrt/.ccache
          key: ccache-${{ github.run_id }}
          restore-keys: ccache-

      - name: Clone lean source
        run: |
          git clone --depth=1 https://github.com/coolsnowwolf/lede openwrt
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Add HomeProxy feed
        run: |
          cd openwrt
          # 添加 ImmortalWrt 的 homeproxy 源
          echo "src-git homeproxy https://github.com/immortalwrt/homeproxy.git" >> feeds.conf.default
          # 可选：添加 kenzo 的 small 源，包含 sing-box 等依赖
          # echo "src-git small https://github.com/kenzok8/small" >> feeds.conf.default
          ./scripts/feeds update homeproxy
          ./scripts/feeds install -a -p homeproxy

      - name: Load custom config
        run: |
          cd openwrt
          cat > .config << 'EOF'
          CONFIG_TARGET_mediatek=y
          CONFIG_TARGET_mediatek_filogic=y
          CONFIG_TARGET_mediatek_filogic_DEVICE_generic=y

          CONFIG_LINUX_5_4=y
          CONFIG_LINUX_5_4_213=y

          # FW4 / nftables 支持（HomeProxy 依赖 firewall4 和 kmod-nft-tproxy）
          CONFIG_PACKAGE_firewall4=y
          CONFIG_PACKAGE_kmod-nft-core=y
          CONFIG_PACKAGE_kmod-nft-nat=y
          CONFIG_PACKAGE_kmod-nft-offload=y
          CONFIG_PACKAGE_kmod-nft-tproxy=y

          # HomeProxy 及其依赖
          CONFIG_PACKAGE_luci-app-homeproxy=y
          CONFIG_PACKAGE_luci-i18n-homeproxy-zh-cn=y
          CONFIG_PACKAGE_sing-box=y
          CONFIG_PACKAGE_chinadns-ng=y
          CONFIG_PACKAGE_kmod-tun=y

          # 可选：如果需要其他依赖
          # CONFIG_PACKAGE_curl=y
          # CONFIG_PACKAGE_ucode-mod-digest=y
          EOF
          make defconfig

      - name: Download
        run: |
          cd openwrt
          make download -j$(nproc)

      - name: Build toolchain
        run: |
          cd openwrt
          make tools/install toolchain/install -j$(nproc) || make tools/install toolchain/install -j1 V=s

      - name: Build kernel (target/linux)
        run: |
          cd openwrt
          make target/linux/compile -j$(nproc) || make target/linux/compile -j1 V=s

      - name: Compile HomeProxy packages
        run: |
          cd openwrt
          make package/luci-app-homeproxy/compile V=s -j$(nproc) || \
          make package/luci-app-homeproxy/compile V=s -j1

      - name: Upload IPK
        uses: actions/upload-artifact@v4
        with:
          name: homeproxy-ipks
          path: |
            openwrt/bin/packages/**/luci-app-homeproxy*.ipk
            openwrt/bin/packages/**/luci-i18n-homeproxy*.ipk
            openwrt/bin/packages/**/sing-box*.ipk
            openwrt/bin/packages/**/chinadns-ng*.ipk
            openwrt/bin/packages/**/kmod-nft-tproxy*.ipk
            openwrt/bin/packages/**/kmod-tun*.ipk
