name: Build uugamebooster (aarch64)

on:
  workflow_dispatch:
  # schedule:
  #   - cron: '0 18 * * *'   # 需要定时就取消注释

permissions:
  contents: read
  actions: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true

      - name: Initialize environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo -E apt-get update
          sudo -E apt-get install -y ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential \
          bzip2 ccache cmake cpio curl device-tree-compiler flex gawk gettext git gperf haveged help2man \
          intltool libc6-dev-i386 libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev \
          libncurses5-dev libncursesw5-dev libreadline-dev libssl-dev libtool lrzsz mkisofs msmtp nano \
          ninja-build p7zip p7zip-full patch pkgconf python2.7 python3 python3-pip python3-ply python3-docutils \
          qemu-utils rsync scons squashfs-tools subversion swig texinfo uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev

      - name: Clone lean source
        run: |
          git clone --depth=1 https://github.com/coolsnowwolf/lede openwrt
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Load custom config (只编译 UU 相关包)
        run: |
          cd openwrt
          cat > .config << 'EOF'
          CONFIG_TARGET_armsr=y
          CONFIG_TARGET_armsr_armv8=y
          CONFIG_TARGET_ARCH_PACKAGES="aarch64_cortex-a53"

          CONFIG_PACKAGE_uugamebooster=y
          CONFIG_PACKAGE_luci-app-uugamebooster=y
          CONFIG_PACKAGE_luci-i18n-uugamebooster-zh-cn=y
          CONFIG_PACKAGE_kmod-tun=y
          CONFIG_PACKAGE_firewall4=y
          EOF
          make defconfig

      - name: Download
        run: |
          cd openwrt
          make download -j$(nproc)
      - name: Build toolchain first
        run: |
          cd openwrt
          make tools/install -j$(nproc) || make tools/install -j1
          make toolchain/install -j$(nproc) || make toolchain/install -j1

      - name: Compile packages only
        run: |
          cd openwrt
          make package/uugamebooster/compile V=s -j$(nproc) || make package/uugamebooster/compile V=s -j1
          make package/luci-app-uugamebooster/compile V=s -j$(nproc) || make package/luci-app-uugamebooster/compile V=s -j1

      - name: Upload IPK
        uses: actions/upload-artifact@v4
        with:
          name: uugamebooster-ipks
          path: |
            openwrt/bin/packages/*/base/uugamebooster*.ipk
            openwrt/bin/packages/*/luci/luci-app-uugamebooster*.ipk
            openwrt/bin/packages/*/luci/luci-i18n-uugamebooster*.ipk
