name: Build uugamebooster (aarch64 cortex-a53)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true

      - name: Initialize environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo -E apt-get update
          sudo -E apt-get install -y ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential \
          bzip2 ccache cmake cpio curl device-tree-compiler flex gawk gettext git gperf haveged help2man \
          intltool libc6-dev-i386 libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev \
          libncurses5-dev libncursesw5-dev libreadline-dev libssl-dev libtool lrzsz mkisofs msmtp nano \
          ninja-build p7zip p7zip-full patch pkgconf python3 python3-pip python3-ply python3-docutils \
          qemu-utils rsync scons squashfs-tools subversion swig texinfo uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: openwrt/.ccache
          key: ccache-${{ github.run_id }}
          restore-keys: ccache-

      - name: Clone lean source
        run: |
          git clone --depth=1 https://github.com/coolsnowwolf/lede openwrt
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Load custom config
        run: |
          cd openwrt
          cat > .config << 'EOF'
          CONFIG_TARGET_armsr=y
          CONFIG_TARGET_armsr_armv8=y

          # FW4 / nftables 支持
          CONFIG_PACKAGE_firewall4=y
          CONFIG_PACKAGE_nftables-json=y
          CONFIG_PACKAGE_kmod-nft-core=y
          CONFIG_PACKAGE_kmod-nft-nat=y
          CONFIG_PACKAGE_kmod-nft-offload=y

          # UU 加速器相关
          CONFIG_PACKAGE_uugamebooster=y
          CONFIG_PACKAGE_luci-app-uugamebooster=y
          CONFIG_PACKAGE_luci-i18n-uugamebooster-zh-cn=y
          CONFIG_PACKAGE_kmod-tun=y
          EOF
          make defconfig

      - name: Download
        run: |
          cd openwrt
          make download -j$(nproc)

      - name: Build toolchain
        run: |
          cd openwrt
          make tools/install toolchain/install -j$(nproc) || make tools/install toolchain/install -j1 V=s

      # ★ 关键步骤：先编译内核，否则所有 kmod 依赖都会报 .ko is missing
      - name: Build kernel (target/linux)
        run: |
          cd openwrt
          make target/linux/compile -j$(nproc) || make target/linux/compile -j1 V=s

      # 内核编译完，再编插件就顺了
      - name: Compile UU packages
        run: |
          cd openwrt
          make package/uugamebooster/compile \
               package/luci-app-uugamebooster/compile \
               package/luci-i18n-uugamebooster-zh-cn/compile \
               V=s -j$(nproc) || \
          make package/uugamebooster/compile \
               package/luci-app-uugamebooster/compile \
               package/luci-i18n-uugamebooster-zh-cn/compile \
               V=s -j1

      - name: Upload IPK
        uses: actions/upload-artifact@v4
        with:
          name: uugamebooster-ipks
          path: |
            openwrt/bin/packages/**/uugamebooster*.ipk
            openwrt/bin/packages/**/luci-app-uugamebooster*.ipk
            openwrt/bin/packages/**/luci-i18n-uugamebooster*.ipk
            openwrt/bin/packages/**/kmod-tun*.ipk
